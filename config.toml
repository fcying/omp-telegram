# Default test configuration. Keep credentials in environment variables.
# Use --config config.local.toml or -c config.local.toml for private overrides.
# Configuration references expand once after TOML parsing, except literal
# omp.environment mode and allow/deny variable names; $$ is a literal dollar sign.

[telegram]
token = "${OMP_TELEGRAM_BOT_TOKEN}"
# Allowlist variables accept comma-separated numeric IDs.
allowed_users = ["${OMP_TELEGRAM_ALLOWED_USERS}"]
allowed_chats = ["${OMP_TELEGRAM_ALLOWED_CHATS}"]

# Telegram live task progress.
#
# off: Disable live progress and typing actions.
# summary: Show assistant activity, active tools, and task state.
# verbose: Also show recent observable tool activity.
# Raw thinking/reasoning and unfiltered tool arguments are never sent.
# Unset, empty, or invalid values fall back to summary.
progress_mode = "$OMP_TELEGRAM_PROGRESS_MODE"

[omp]
binary = "omp"
# Optional shell-style quoting only; never executed by a shell. Unset/empty means no args.
args = "${OMP_TELEGRAM_ARGS}"
# Example: args = '--config "${HOME}/.config/omp/telegram.yml"'
[omp.environment]
# Default denylist inherits all present and future parent variables except OMP_TELEGRAM_BOT_TOKEN.
mode = "denylist"
# In denylist mode, deny named parent variables from OMP children, not the bridge.
# The bot token is always filtered and need not be listed.
# If OMP requires a denied API key, authentication using that key will fail.
# deny = ["SOME_API_KEY"]
# Alternatively, use mode = "allowlist" with an explicit allow list of every
# parent variable OMP needs, including provider credentials and runtime variables
# such as PATH/HOME. Only listed, present names are passed. An empty allow list
# is valid; deny must be absent in allowlist mode, even if empty.
# allow = ["PATH", "HOME", "YOUR_PROVIDER_API_KEY"]

[storage]
# Relative data paths resolve beside the executable, not the shell working directory.
data_dir = "."
# Unset or empty OMP_TELEGRAM_WORKSPACE_ROOT uses workspace/ beside the executable.
workspace_root = "${OMP_TELEGRAM_WORKSPACE_ROOT}"
# Remove terminal database messages older than this many days. Set 0 to disable cleanup.
database_retention_days = 90

[worker]
# max_workers maximum: 64 connected OMP processes.
max_workers = 8
# queue_capacity maximum: 1024 waiting tasks per conversation.
queue_capacity = 16
# Release an unused OMP runtime after this duration while retaining the logical session.
# Set 0 or disabled to turn automatic release off.
idle_timeout = "30m"

[logging]
# Structured logs default to text at info level. The per-component table is optional.
level = "info"
# Format: text (compact timestamp LEVEL [component] message key=value attrs)
# or json (unchanged standard slog.JSONHandler, one JSON object per line).
# Text example: 2026-09-19 13:20:01 WARN [telegram] telegram polling failed event=poll_failed reason=timeout
# Both formats write to stderr.
format = "text"

[logging.component_levels]
# Unspecified components inherit logging.level (info by default).
# Uncomment only the components whose level should differ from the global level.
# daemon = "debug"
# bridge = "debug"
# rpc = "debug"
# telegram = "warn"
# store = "debug"
# media = "debug"
