name: release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      target: ${{ steps.release.outputs.target }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine release version
        id: release
        run: |
          set -euo pipefail
          source_version=$(sed -nE 's/^var Version = "(v[0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' cmd/omp-telegram/main.go)
          if [[ ! "$source_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected one Version value in vMAJOR.MINOR.PATCH form" >&2
            exit 1
          fi
          target="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            target="${{ github.event.pull_request.head.sha }}"
          fi
          prerelease=true
          version="nightly"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]] && ! git show-ref --verify --quiet "refs/tags/${source_version}"; then
            version="$source_version"
            prerelease=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.target }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check format
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            printf 'Files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Check dependencies
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Race test
        if: matrix.arch == 'amd64'
        run: go test -race ./...

      - name: Build and smoke test
        run: |
          set -euo pipefail
          test "$(go env GOOS)/$(go env GOARCH)" = "linux/$TARGET_ARCH"
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -buildvcs=true -ldflags "-s -w -X main.Version=$VERSION" -o dist/omp-telegram ./cmd/omp-telegram
          actual=$(OMP_TELEGRAM_BOT_TOKEN='' ./dist/omp-telegram --config /nonexistent --version)
          [[ "$actual" == "omp-telegram $VERSION" || "$actual" == "omp-telegram $VERSION ("* ]]
          test "$(./dist/omp-telegram -v)" = "$actual"
          ./dist/omp-telegram --help
          tar cJf "dist/omp-telegram-linux-${TARGET_ARCH}.txz" -C dist omp-telegram -C "$GITHUB_WORKSPACE" LICENSE

      - uses: actions/upload-artifact@v6
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/omp-telegram-linux-${{ matrix.arch }}.txz
          if-no-files-found: error

  # Same-repository pull requests intentionally publish the moving "nightly" prerelease
  # so contributors can test the exact PR build; fork pull requests remain build-only below.
  release:
    needs: [prepare, build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          pattern: release-linux-*
          path: build
          merge-multiple: true

      - name: Create checksums
        working-directory: build
        run: sha256sum ./*.txz > SHA256SUMS

      - name: Publish release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          TARGET: ${{ needs.prepare.outputs.target }}
        run: |
          set -euo pipefail
          if [[ "$PRERELEASE" == true ]]; then
            while IFS= read -r release_id; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
            done < <(gh api --paginate --jq '.[] | select(.draft and .name == "nightly") | .id' "repos/$GITHUB_REPOSITORY/releases?per_page=100")
            if gh release view "$VERSION" >/dev/null 2>&1; then
              gh release delete "$VERSION" --yes
            fi
            git tag --force "$VERSION" "$TARGET"
            git push origin "refs/tags/$VERSION" --force
            gh release create "$VERSION" build/* --target "$TARGET" --generate-notes --title "$VERSION" --prerelease
          else
            gh release create "$VERSION" build/* --target "$TARGET" --generate-notes --title "$VERSION"
          fi
